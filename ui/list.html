<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>便签列表</title>
  <link rel="stylesheet" href="list.css">
</head>

<body>
  <header class="head" id="head">
    <div class="title">便签</div>
    <div class="actions">
      <button id="btnNew" class="primary">新建</button>
      <button id="btnPin" class="icon pin" aria-pressed="false" title="窗口置顶（置顶后不会被其他窗口盖住）" aria-label="窗口置顶">
        <!-- 实心图钉（Material 的 push_pin 形状）：16px 下轮廓还认得出，
             线框版在这个尺寸会糊成一根针 -->
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"
            fill="currentColor" />
        </svg>
      </button>
      <button id="btnMenu" class="icon" title="更多操作（也可以在空白处右键）" aria-label="更多">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <circle cx="12" cy="5.5" r="1.7" fill="currentColor" />
          <circle cx="12" cy="12" r="1.7" fill="currentColor" />
          <circle cx="12" cy="18.5" r="1.7" fill="currentColor" />
        </svg>
      </button>
      <button id="btnClose" class="icon" title="关闭（Esc）" aria-label="关闭">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </header>

  <div class="searchbar">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
      <circle cx="11" cy="11" r="6.2" fill="none" stroke="currentColor" stroke-width="1.7" />
      <path d="M16 16l4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
    </svg>
    <input id="q" type="text" placeholder="搜索标题和正文…" autocomplete="off" spellcheck="false">
  </div>

  <!-- 排序 / 过滤 / 全选。排序用原生 <select>（WebView2 里就是系统下拉，
       键盘也能用）；过滤走宿主弹出的原生菜单 —— 五个三态条件横着排不开。 -->
  <div class="tools">
    <select id="sortSel" class="sort" title="排序方式">
      <option value="default:desc">默认（置顶优先）</option>
      <option value="created:desc">创建时间 ↓</option>
      <option value="created:asc">创建时间 ↑</option>
      <option value="updated:desc">更新时间 ↓</option>
      <option value="updated:asc">更新时间 ↑</option>
      <option value="title:asc">标题 ↑</option>
      <option value="title:desc">标题 ↓</option>
    </select>
    <button id="btnFilter" class="chip" title="按条件过滤（可多选，条件之间同时满足）">
      过滤<i class="fcount" id="fCount" hidden></i>
    </button>
    <button id="btnClearFilter" class="chip plain" title="清空全部过滤条件" hidden>清空</button>
    <span class="grow"></span>
    <label class="all" title="全选列表里看得见的这些（不会选中被过滤掉的）">
      <input type="checkbox" id="chkAll"><span>全选</span>
    </label>
  </div>

  <!-- 批量条：只在勾选了便签时出现，换掉底部的提示行。
       「置顶 / 收起」两个按钮的字会跟着选中项的状态变（全置顶了就显示"取消置顶"），
       少一个按钮，也少一次想"这按钮到底会置顶还是取消"。 -->
  <div class="selbar" id="selbar" hidden>
    <div class="selinfo">
      已选 <b id="selN">0</b> 张
      <button class="mini link" id="btnSelClear">清除</button>
    </div>
    <div class="selacts">
      <button class="mini" id="actPin" data-act="pin">置顶</button>
      <button class="mini" id="actHide" data-act="hide">收起</button>
      <button class="mini" data-act="color">颜色</button>
      <button class="mini" data-act="opacity">透明度</button>
      <button class="mini" data-act="export">导出</button>
      <button class="mini" data-act="clear-hotkey">清快捷键</button>
      <button class="mini danger" data-act="delete">删除…</button>
    </div>
  </div>

  <main class="list" id="list"></main>

  <footer class="foot">
    <span id="count">—</span>
    <span class="tip">Esc 关闭 · Ctrl+N 新建</span>
  </footer>

  <script src="list.js"></script>
</body>

</html>
